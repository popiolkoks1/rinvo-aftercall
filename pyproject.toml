[project]
name = "aftercall"
version = "0.1.0"
description = "Turn a client call transcript into a reviewed, routed action list with per-client memory."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
aftercall = "aftercall.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aftercall"]
